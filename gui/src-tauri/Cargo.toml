[package]
name = "oh-ben-claw-gui"
version = "0.1.0"
description = "Oh-Ben-Claw — native desktop GUI"
authors = ["thewriterben"]
license = "MIT"
repository = "https://github.com/thewriterben/Oh-Ben-Claw"
edition = "2021"
rust-version = "1.77.2"

# Its own workspace root, which it needs in order to get as far as failing.
#
# The root manifest lists `gui/src-tauri` in `workspace.exclude`, so this
# package is not a member. Without this table cargo refuses before compiling
# anything:
#
#     error: current package believes it's in a workspace when it's not
#
# With it, cargo gets to the build script and stops there instead:
#
#     `icons/icon.ico` not found; required for generating a Windows Resource
#     file during tauri-build
#
# There is no `icons/` directory in this package. So: the root workspace does
# not compile this tree, `cargo check` here could not start, and `pnpm tauri
# build` cannot finish. Nothing has compiled the GUI's Rust in this checkout,
# and no gate would have said so — `cargo test --workspace` passes 1558 tests
# without touching a line of it.
#
# Found on 2026-08-14 by trying to verify a four-line edit to `commands.rs` and
# discovering there was no way to. This table is kept because moving the
# failure from "cannot resolve the manifest" to "missing an asset" is the
# difference between a wall and a task; supplying the icons is that task, and
# it is not this change.
[workspace]

[lib]
name = "oh_ben_claw_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri core
tauri          = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart    = "2"
tauri-plugin-notification = "2"
tauri-plugin-shell        = "2"
tauri-plugin-store        = "2"

# Serialization
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"

# Async runtime
tokio       = { version = "1", features = ["full"] }

# Error handling
anyhow      = "1"
thiserror   = "1"

# Logging
tracing             = "0.1"
tracing-subscriber  = { version = "0.3", features = ["env-filter"] }

# Oh-Ben-Claw core library (shared with CLI)
oh-ben-claw = { path = "../..", features = [] }

# System info
sysinfo = "0.32"

[features]
# This feature is used for production builds or when `devPath` points to the filesystem
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level    = "z"
lto          = true
codegen-units = 1
panic        = "abort"
strip        = true
