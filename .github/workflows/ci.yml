name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
jobs:
  # ── Build & Test (host) ────────────────────────────────────────────────────
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Build (default features)
        run: cargo build --workspace
      - name: Build (all host features)
        run: cargo build --workspace --features hardware,mqtt-spine
      - name: Build (NanoPi feature, Linux only)
        run: cargo build --workspace --features hardware,peripheral-nanopi
      - name: Run tests
        run: cargo test --workspace
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Format check
        run: cargo fmt --all --check
  # ── Each crate compiled alone ─────────────────────────────────────────────
  # `cargo test --workspace` unifies Cargo features across every member, so a
  # crate can use a feature of a shared dependency that it never declared, as
  # long as some sibling declares it. The workspace build stays green and the
  # crate is quietly broken for anyone who takes it on its own.
  #
  # obc-tunnel did exactly this, twice. It declared tokio `rt` while calling
  # `tokio::runtime::Runtime::new()` (needs `rt-multi-thread`) and importing
  # `tokio::sync::Mutex` (needs `sync`), and both were supplied by the root
  # binary's tokio features. The first was caught only when the crate was
  # vendored into OBC-Prime and built with no binary alongside it. The second
  # survived even that -- and not via a sibling, since no crate in either
  # workspace declares tokio `sync`; it arrives through hyper-util, levels down
  # someone else's dependency tree. Only `cargo test -p obc-tunnel` -- one
  # crate, its own feature resolution, no neighbours -- found it.
  #
  # So this job is per-crate on purpose. A second workspace, however
  # independent, is still a workspace: it hides the same class of defect behind
  # a different set of neighbours, and the neighbours that matter are not the
  # ones visible in the manifests. The crate list is read from cargo metadata
  # rather than written down, so a newly extracted crate is covered the day it
  # lands instead of the day someone remembers to add it here.
  #
  # It runs `check` *and* `test`, and the two are not redundant. Building the
  # lib as a test target links [dev-dependencies] into it, so a dependency the
  # library genuinely needs can be declared dev-only and never noticed. obc-a2a
  # arrived that way on 2026-08-08 -- `A2AClient` uses reqwest, reqwest was
  # under [dev-dependencies], and:
  #
  #     cargo test  -p obc-a2a --all-targets  -> 0
  #     cargo check -p obc-a2a                -> 101   E0433 unresolved reqwest
  #
  # This job at the time ran only the first command. It was itself the gate
  # that missed it, one day after being written to catch exactly this family of
  # under-declared dependency. `check` first, so the failure names the real
  # problem instead of a test that cannot build.
  crates-alone:
    name: Each crate compiled alone
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-alone-${{ hashFiles('**/Cargo.lock') }}
      - name: Build and test each crate with no siblings
        run: |
          set -euo pipefail
          # `tr -d '\r'` is not decoration: on Windows python's print emits CRLF,
          # every crate name picks up a trailing carriage return, and cargo
          # rejects it with "invalid character". Harmless on the runner, fatal
          # for anyone running this script by hand to check it before pushing --
          # and a gate nobody can run locally is a gate that rots.
          crates=$(cargo metadata --no-deps --format-version 1 | python3 -c \
            'import json,sys; [print(p["name"]) for p in json.load(sys.stdin)["packages"] if p["name"].startswith("obc-")]' \
            | tr -d '\r' | sort)
          if [ -z "$crates" ]; then
            echo "no obc-* crates found -- the discovery query is wrong, not the workspace"
            exit 1
          fi
          echo "$crates" | tr '\n' ' '; echo
          failed=""
          for c in $crates; do
            echo "::group::$c"
            if cargo check -p "$c" && cargo test -p "$c" --all-targets; then
              echo "$c ok"
            else
              failed="$failed $c"
            fi
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "crates that do not stand alone:$failed"
            exit 1
          fi
  # ── Every feature compiled at least once ──────────────────────────────────
  # `build-and-test` builds three feature combinations: default,
  # `hardware,mqtt-spine`, and `hardware,peripheral-nanopi`. Five features --
  # peripheral-rpi, rppal, peripheral-stm32, gui, semantic -- appear in none of
  # them, so the code behind them was never handed to a compiler by anything in
  # this repository.
  #
  # `peripheral-stm32` and `peripheral-rpi` are what that costs. Both landed in
  # the same commit on 2026-03-14 -- "feat(phase-5): expanded hardware
  # ecosystem" -- and neither has compiled since. stm32 fails with two E0283s
  # from a `.into()` whose target type is a generic parameter. rpi fails with
  # E0597 and E0505 from one line: a `Path` borrowed from a `String` that the
  # `spawn_blocking` closure then moves. Nobody noticed for five months, because
  # noticing required typing a command no job ran. Both are documented in the
  # peripherals table in mod.rs, advertising tools that could not have been
  # built.
  #
  # A note on where this job runs, learned the hard way. rpi.rs is behind
  # `all(feature = "peripheral-rpi", target_os = "linux")`, so a developer
  # checking these features on macOS or Windows compiles an empty module and
  # sees green. That is exactly what happened while this job was being written:
  # twelve features passed locally, and this job failed on the first push with
  # the error above. Running on ubuntu-latest is not incidental to the gate --
  # for the peripheral features it *is* the gate, and a local pass is not a
  # substitute for it.
  #
  # One compile per feature would have caught it on the first push. So: one
  # compile per feature, over the feature list read from cargo metadata, so a
  # feature added tomorrow is covered tomorrow. `--all-features` goes last,
  # because a feature can compile alone and still conflict with another.
  #
  # cargo metadata reports twelve features, not the eight in `[features]`: an
  # optional dependency implies a feature of the same name (`nusb`, `rppal`,
  # `serialport`, `tokio-serial`). Those are redundant with `hardware` and
  # `peripheral-rpi` and cost four extra compiles. They stay in, because they
  # are switches a user can genuinely throw, and because filtering them would
  # mean maintaining a list -- which is the failure this job exists to prevent.
  #
  # `clippy -D warnings` rather than plain `check`, because it costs roughly the
  # same (clippy is a check plus lints) and because feature-gated code is
  # precisely the code most likely to drift below the standard the rest of the
  # repository is held to. All twelve features and `--all-features` pass it as
  # of this commit, on Linux.
  features-alone:
    name: Every feature compiled at least once
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-features-${{ hashFiles('**/Cargo.lock') }}
      - name: Check each declared feature on its own
        run: |
          set -euo pipefail
          # `tr -d '\r'` guards the Windows case, where python prints CRLF and
          # cargo rejects the trailing carriage return as an invalid character.
          # Harmless on the runner; the point is that this script can be run by
          # hand on a dev machine before pushing, and a gate nobody can run
          # locally is a gate that rots.
          feats=$(cargo metadata --no-deps --format-version 1 | python3 -c \
            'import json,sys; p=[x for x in json.load(sys.stdin)["packages"] if x["name"]=="oh-ben-claw"][0]; [print(f) for f in p["features"] if f != "default"]' \
            | tr -d '\r' | sort)
          if [ -z "$feats" ]; then
            echo "no features found -- the discovery query is wrong, not the manifest"
            exit 1
          fi
          echo "$feats" | tr '\n' ' '; echo
          failed=""
          for f in $feats; do
            echo "::group::$f"
            if cargo clippy --features "$f" --all-targets -- -D warnings; then
              echo "$f ok"
            else
              failed="$failed $f"
            fi
            echo "::endgroup::"
          done
          echo "::group::--all-features"
          if cargo clippy --all-features --all-targets -- -D warnings; then
            echo "all-features ok"
          else
            failed="$failed --all-features"
          fi
          echo "::endgroup::"
          if [ -n "$failed" ]; then
            echo "features that do not compile:$failed"
            exit 1
          fi
  # ── MCP against a real third-party server ─────────────────────────────────
  # Blocking, unlike the conformance job below, and deliberately so. It found
  # three bugs the moment it was first run by hand -- a legacy server classified
  # as 2026, a client that assumed strict request/response alternation on stdio,
  # and a tools/list that rendered an unreadable response as an empty one. None
  # was reachable from the hand-written fixture in src/bin/mcp-conformance-server.rs,
  # because a fixture only refuses what its author thought to make it refuse.
  #
  # The test is #[ignore]d so a plain `cargo test` stays offline; this runs it
  # explicitly. The alternative -- leaving it ignored and trusting someone to
  # remember -- is the exact shape of every stale gate this repository has found.
  #
  # The server version is pinned in the test. A red build here should mean our
  # regression, not their release.
  mcp-real-server:
    name: MCP against the reference implementation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: negotiate against @modelcontextprotocol/server-everything
        run: cargo test --test mcp_real_server -- --ignored --nocapture

  # ── MCP conformance (official suite vs. our hand-rolled implementation) ───
  # Runs the Model Context Protocol conformance suite against the OBC MCP
  # server in BOTH protocol modes. Advisory (continue-on-error) until an
  # --expected-failures baseline is captured from the first runs; then flip
  # to blocking.
  mcp-conformance:
    name: MCP Conformance (2025-11-25 + 2026-07-28 draft)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build OBC
        run: cargo build --bin oh-ben-claw
      - name: Conformance — legacy lifecycle (2025-11-25)
        run: |
          ./target/debug/oh-ben-claw mcp-serve --transport http --port 3411 --mode legacy-2024 &
          SERVER_PID=$!
          sleep 2
          npx --yes @modelcontextprotocol/conformance server \
            --url http://127.0.0.1:3411/mcp --spec-version 2025-11-25 || true
          kill $SERVER_PID
      - name: Conformance — stateless lifecycle (2026-07-28 draft)
        run: |
          ./target/debug/oh-ben-claw mcp-serve --transport http --port 3412 --mode stateless-2026 &
          SERVER_PID=$!
          sleep 2
          npx --yes @modelcontextprotocol/conformance server \
            --url http://127.0.0.1:3412/mcp --spec-version draft || true
          kill $SERVER_PID
  # ── Cross-compile for AArch64 (NanoPi Neo3) ───────────────────────────────
  cross-aarch64:
    name: Cross-compile AArch64 (NanoPi Neo3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - name: Install cross-compilation tools
        run: sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-aarch64-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Cross-compile for AArch64
        run: |
          cargo build \
            --workspace \
            --target aarch64-unknown-linux-gnu \
            --features hardware,peripheral-nanopi
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
  # ── Security audit ─────────────────────────────────────────────────────────
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Cheap, and it fails for the same reason `cargo audit` did on
      # 2026-08-14 without needing the advisory database. crates/obc-spine
      # declared a bare `rumqttc = "0.24"` against a root that had turned its
      # defaults off under a comment naming four RUSTSEC advisories in
      # rustls-webpki. Cargo unifies features across the graph, so one manifest
      # asking for the defaults re-enabled `use-rustls` for everything and put
      # the whole vulnerable certificate stack back. Build, clippy, fmt and
      # 1556 tests were green; nothing about the build was wrong.
      #
      # It runs before the audit because it names the manifest line, where
      # `cargo audit` names a transitive crate four levels down.
      - name: manifests agree with the root on load-bearing features
        run: python3 scripts/check_feature_unification.py
      - name: Install cargo-audit
        run: cargo install cargo-audit
      - name: Run security audit
        run: cargo audit
  # ── GUI — TypeScript type-check ───────────────────────────────────────────
  gui-check:
    name: GUI TypeScript Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gui
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm ci
      - name: TypeScript type-check
        run: npx tsc --noEmit
