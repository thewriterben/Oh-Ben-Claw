# Generated by Oh-Ben-Claw DeploymentPlanner
# Scenario: NanoPi-Neo3 Reference Deployment

[agent]
name = "nanopi-neo3-reference-deployment"
system_prompt = """
You are an embodied agent deployed on a hardware swarm. You can see, hear,
sense and act through your connected peripheral nodes. Reach for a tool when
the answer depends on the current state of the machine; otherwise just answer.
Confirm before any command that moves hardware.
"""
max_tool_iterations = 20

# Brain: export ANTHROPIC_API_KEY, OPENAI_API_KEY or OPENROUTER_API_KEY and
# the agent uses that provider. No key anywhere falls back to a local Ollama.
# Uncomment to pin one instead:
# [provider]
# name = "anthropic"
# model = "claude-sonnet-4-5"

[peripherals]
enabled = true

[[peripherals.boards]]
board = "nanopi-neo3"
transport = "native"

[[peripherals.boards]]
board = "waveshare-esp32-s3-touch-lcd-2.1"
transport = "serial"
path = "/dev/ttyUSB0"  # adjust to the port your board enumerates as
baud = 115200

[[peripherals.boards]]
board = "xiao-esp32s3-sense"
transport = "serial"
path = "/dev/ttyUSB0"  # adjust to the port your board enumerates as
baud = 115200

[[peripherals.boards]]
board = "sipeed-6plus1-mic-array"
transport = "serial"
path = "/dev/ttyUSB0"  # adjust to the port your board enumerates as
baud = 115200

[orchestrator]
enabled = true
routing = "manual"

[[orchestrator.agents]]
name = "vision-agent"
role = "Vision specialist running on xiao-esp32s3-sense. Captures images, analyses visual context, detects objects and scenes, and reports findings to the orchestrator."
tools = ["camera_capture", "vision_analyze"]

[[orchestrator.agents]]
name = "audio-agent"
role = "Audio specialist running on sipeed-6plus1-mic-array. Captures microphone audio, performs speech-to-text transcription, detects wake words, and forwards transcriptions to the orchestrator."
tools = ["audio_sample", "audio_transcribe"]

[[orchestrator.agents]]
name = "speech-display-agent"
role = "Display and speech output specialist running on waveshare-esp32-s3-touch-lcd-2.1. Renders text and status information on the display, accepts touch input."
tools = ["gpio_write", "speak"]

[[orchestrator.agents]]
name = "sensing-agent"
role = "Environmental sensing specialist running on nanopi-neo3. Reads temperature, humidity, and other sensor data, and forwards readings to the orchestrator."
tools = ["sensor_read", "i2c_read", "gpio_read"]

[spine]
kind = "mqtt"
host = "localhost"
port = 1883
tool_timeout_secs = 30

[edge]
enabled = true
max_history_messages = 20
max_tool_iterations = 5
p2p_enabled = true

[fleet]
enabled = true

# Persistent memory is on by default; the database lives in the data root
# (platform-specific). Set OBC_DATA_DIR, or [paths].data_dir, to move it —
# and give a second agent on the same machine its own, or they share one
# database and one set of standing approval grants.

[deployment]
enabled = true
scenario = "NanoPi-Neo3 Reference Deployment"
auto_plan = true
feature_desires = ["vision", "listening", "speech", "environmental_sensing", "display_output", "touch_input", "wireless_mesh", "persistent_memory"]

[[deployment.hardware]]
name = "nanopi-neo3"
board_name = "nanopi-neo3"
transport = "native"
role = "host"
accessories = ["dht22"]

[[deployment.hardware]]
name = "waveshare-esp32-s3-touch-lcd-2.1"
board_name = "waveshare-esp32-s3-touch-lcd-2.1"
transport = "serial"
role = "display"

[[deployment.hardware]]
name = "xiao-esp32s3-sense"
board_name = "xiao-esp32s3-sense"
transport = "serial"
role = "vision"

[[deployment.hardware]]
name = "sipeed-6plus1-mic-array"
board_name = "sipeed-6plus1-mic-array"
transport = "serial"
role = "listening"
