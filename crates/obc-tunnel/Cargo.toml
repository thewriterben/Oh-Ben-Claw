[package]
name = "obc-tunnel"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Open Body Control's network tunnels: Cloudflare, ngrok and Tailscale providers behind one interface, so a gateway on a home network can be reached without opening a port."

# The eleventh piece of the agent extracted (2026-08-06), and the same shape as
# obc-cost the same day: `tunnel` named exactly one thing outside itself --
# `TunnelConfig`, its own `[tunnel]` block sitting in the root config module --
# so the config struct travels with the providers that read it.
#
# That is the arrangement obc-planner (`DeploymentConfig`), obc-conscience
# (`ConscienceConfig`) and obc-cost (`CostConfig`) already use: the crate owns
# its config block and the root `Config` composes them.
#
# Dependencies were read off the module and then corrected by the compiler,
# which is the only reliable order. A `use`-declaration survey sees none of
# these three: `tokio` appears as the `#[tokio::test]` attribute macro, and
# `tracing` and `serde_json` are called fully-qualified at the point of use
# (`tracing::info!`, `serde_json::from_str`) without ever being imported.
#
# That is the same blind spot obc-observability's manifest records for attribute
# macros, now seen twice more. The survey answers "what does this module need
# from the agent"; it has never answered "what does it need at all".
#
# The tokio feature list was wrong twice, and how each error was found matters
# more than the errors.
#
# `rt-multi-thread`, not `rt`: `tailscale.rs` calls
# `tokio::runtime::Runtime::new()`, which only exists with the multi-threaded
# runtime; `rt` alone gives you `Builder::new_current_thread`. And `sync`, for
# the `tokio::sync::Mutex` in `lib.rs`. Both compiled here anyway, because the
# root binary declares them and cargo unifies features across a workspace — so
# the crate was borrowing two features it never declared.
#
# `rt-multi-thread` fell over the moment the crate was vendored into OBC-Prime,
# which builds it with no binary alongside it. `sync` survived even that, and
# not because a sibling declared it — no crate in either workspace declares
# tokio `sync` at all. It arrives through hyper-util, several levels down
# somebody else's dependency tree (`cargo tree -e features` in OBC-Prime shows
# the chain). A crate you have never heard of was holding this one up.
#
# So the lesson is not "vendor it somewhere else and see". A second workspace is
# still a workspace; it hides the same class of defect behind a different set of
# neighbours — and the neighbours that matter are not the ones you can see in
# the manifests. The only build that answers "does this crate declare what it
# uses" is the one with nothing else in it. That is now the `crates-alone` CI
# job, run per crate, over a list read from cargo metadata rather than written
# down, so a newly extracted crate is covered the day it lands.
[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = { version = "0.1", default-features = false }
tokio = { version = "1.42", default-features = false, features = ["rt", "rt-multi-thread", "sync", "macros", "process", "io-util", "time"] }
