[package]
name = "obc-cost"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Open Body Control's token accounting: per-call cost records in SQLite, daily and monthly spending budgets, and the verdict a caller checks before spending more."

# The tenth piece of the agent extracted (2026-08-06). `cost` named exactly one
# thing outside itself -- `CostConfig`, its own config block, sitting in the
# root config module -- so the config struct travels with it.
#
# That is the arrangement the other crates already use: obc-planner owns
# `DeploymentConfig`, obc-conscience owns `ConscienceConfig`, and the root
# `Config` composes them. Re-exported from `crate::config`, so no call site
# changed.
#
# Compiled verbatim in a scratch crate against the seven external crates below
# and nothing from the agent, 8 tests passing, before any of this was written.
[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
parking_lot = "0.12"
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = { version = "0.1", default-features = false }
uuid = { version = "1.11", default-features = false, features = ["v4", "std"] }
