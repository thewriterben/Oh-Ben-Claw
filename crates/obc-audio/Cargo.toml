[package]
name = "obc-audio"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Open Body Control's audio suite: heard events and utterances recorded into bitemporal world memory, a pluggable speech sink, and a controller that treats hearing and speaking as two directions of the same loop."

# The twentieth crate. Small -- 305 lines -- and the last one the cycle work
# unblocked: `audio <-> tools` was the final cycle in the core, and it was a
# `TextToSpeechTool` field on a `SpeechSink` implementation.
#
# Both of the sinks that had dependencies left on 2026-08-13. `SpineSpeechSink`
# held an `Arc<SpineClient>` and went to `src/spine/speech.rs`; `TtsSpeechSink`
# held a `TextToSpeechTool` and went to `src/tools/builtin/audio_speech.rs`.
# Seventh and eighth time this month that the answer was to leave the trait
# where the abstraction is and move the implementation to where the dependency
# is, and the first time two instances were in one file.
#
# `LoggingSpeechSink` stayed, and it is worth saying why: it depends on nothing,
# which is exactly what qualifies it as the default. Audio output is a dry run
# until someone wires a real engine, and that property lives in this crate
# rather than in whatever wires it.
#
# The controller records both directions into world memory as facts with an
# `Origin`, so what the agent *said* is evidence on the same footing as what it
# heard -- which is the reason this crate depends on obc-memory and nothing
# else.
#
# `anyhow` is here because `cargo check -p` asked for it, and this is the third
# crate this month where it appears in no `use` line -- four call sites write
# `anyhow::Result<...>` inline in a return type, including the `SpeechSink`
# trait's own method signature. obc-learning was the second, and
# `extractability.py`'s first version reporting `config` as edge-free was the
# first. A survey that reads imports cannot see this shape. The compiler can,
# in seconds, which is the entire argument for compiling each crate alone.
[dependencies]
anyhow = "1.0"
async-trait = "0.1"
obc-memory = { path = "../obc-memory" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = { version = "0.1", default-features = false }

[dev-dependencies]
tokio = { version = "1.42", default-features = false, features = ["rt", "rt-multi-thread", "macros"] }
