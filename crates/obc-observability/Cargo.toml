[package]
name = "obc-observability"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Open Body Control's self-instrumentation: structured spans, a bounded span ring buffer, and in-memory counters for the agent loop, tool calls and gateway requests."

# The fifth piece of the agent extracted as its own crate (2026-08-02), and the
# second picked by the derived queue (`scripts/extractability.py`) rather than by
# hand. It was one of three modules with zero blocking edges; a2a was the
# obvious-looking alternative and was disqualified for being unreachable (see
# the README block on A2A), and scheduler is the remaining one.
#
# Extractability was a compiler's verdict before it was a plan: `mod.rs` was
# compiled verbatim in a scratch crate whose entire dependency universe is the
# six external crates below, nothing from the agent, and its 18 unit tests plus
# the doctest passed there. The only edit the move required was the doctest's
# own `use` path.
#
# That scratch build also corrected the survey. `extractability.py` reads `use`
# declarations and inline type paths, so it did not see `#[async_trait::…]` or
# `#[tokio::test]` — three attribute-macro dependencies that a reader of its
# output would not have listed. It got the *blocking edge* answer right, which
# is what it is for; it is not a dependency manifest, and the compiler is.
#
# Not to be confused with `obc-telemetry`, which is the agent watching its body.
# This crate is the agent watching itself.
[dependencies]
anyhow = "1.0"
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = { version = "0.1", default-features = false }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "ansi", "env-filter"] }

[dev-dependencies]
tokio = { version = "1.42", default-features = false, features = ["rt", "macros", "time"] }
