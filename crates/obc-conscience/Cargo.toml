[package]
name = "obc-conscience"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Open Body Control's perception & reach gate: deterministic, model-independent limits on what the agent may OBSERVE (consent registry, default-deny for humans) and what it may REACH (egress allowlist). The Track 0 pattern extended to the front of the pipeline."

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"

[dev-dependencies]
serde_json = "1.0"
