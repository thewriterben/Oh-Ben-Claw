[package]
name = "obc-spine"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Open Body Control's communication spine: the MQTT backbone between brain and nodes, a serial LoRa gateway and mesh, the mesh supervisor, a P2P transport, and the sinks that carry movement, reflex actions, speech and fleet assignments onto the wire."

# The twenty-third crate, 5100 lines, and for most of this project's history the
# largest thing in the tree that could not move.
#
# It never had a refactor. Its blocking-edge count went from four to zero
# without a line of its own code changing, because all four edges were the same
# mistake made four times: an implementation living with the abstraction it
# implements instead of with the dependency it holds.
#
#   SpineActuatorSink  left `movement` on 2026-08-08, holding a SpineClient
#   SpineActionSink    left the agent's reflex module on 2026-08-12, same
#   fleet_bridge       left the fleet coordinator on 2026-08-13 -- and was a
#                      second implementation of an integration `lora_mesh` was
#                      already doing from this side for the other transport
#   SpineSpeechSink    left the audio suite on 2026-08-13, holding a SpineClient
#
# Trait where the abstraction is, implementation where the dependency is. Each
# move released a module that then became a crate: obc-movement, obc-reflex,
# obc-fleet, obc-audio. The spine did not get smaller; it got *pointed at*
# instead of pointing.
#
# What it unblocks is why it went now. `tools` is 8880 lines, the largest module
# left in the tree, and it was blocked by exactly one edge: this one. Behind
# tools sit `mcp` and `providers`, each blocked by one edge into tools.
#
# Five of these are here because the compiler asked, and an import survey of
# this module would have produced none of them:
#
#   tracing      36 macro calls at full paths, zero `use` lines
#   uuid         2 call sites, `uuid::Uuid::new_v4()`
#   obc-safety   9 sites -- frame authentication and node pairing, all written
#                as `obc_safety::frame_auth::…` inline in type positions
#   anyhow       inline in return types
#   async-trait  only ever an attribute
#
# obc-safety is the one worth pausing on. The spine authenticates every frame it
# receives -- tag, replay window, outbound counter -- and nine references to the
# crate that does it appear nowhere a reader grepping for imports would look.
# The largest module in the tree was reading its security dependency entirely
# through full paths. Sixth crate this month whose real dependency list came
# from `cargo check -p` rather than from reading the source.
[dependencies]
anyhow = "1.0"
async-trait = "0.1"
obc-audio = { path = "../obc-audio" }
obc-fleet = { path = "../obc-fleet" }
obc-memory = { path = "../obc-memory" }
obc-movement = { path = "../obc-movement" }
obc-navigation = { path = "../obc-navigation" }
obc-reflex = { path = "../obc-reflex" }
obc-safety = { path = "../obc-safety" }
obc-tool-api = { path = "../obc-tool-api" }
rumqttc = "0.24"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.42", features = ["rt", "rt-multi-thread", "macros", "sync", "time", "io-util", "net"] }
tokio-serial = { version = "5", default-features = false, optional = true }
serialport = { version = "4", default-features = false, optional = true }
tracing = { version = "0.1", default-features = false }
uuid = { version = "1", features = ["v4"] }

# The two serial transports are behind the same flag they were behind in the
# tree, and the flag came with them: four `#[cfg(feature = "hardware")]` blocks
# across lora_gateway and lora_mesh, and no use of either crate outside them.
# The root workspace forwards its own `hardware` feature here, so
# `--features hardware` still reaches the serial code from the binary.
#
# `cargo check -p obc-spine` was clean before this existed -- with four
# `unexpected cfg condition value` warnings, which is the compiler saying the
# gated code is unreachable rather than broken. A crate that silently drops its
# hardware paths when built alone would still pass every gate in CI.
[features]
default = []
hardware = ["dep:tokio-serial", "dep:serialport"]
