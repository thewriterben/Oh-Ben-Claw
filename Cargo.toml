[workspace]
members = [
    ".",
    "planner-wasm",
    "crates/obc-paths",
    "crates/obc-memory",
    "crates/obc-planner",
    "crates/obc-safety",
    "crates/obc-telemetry",
    "crates/obc-observability",
    "crates/obc-scheduler",
    "crates/obc-position",
    "crates/obc-cost",
    "crates/obc-tunnel",
    "crates/obc-conscience",
    "crates/obc-a2a",
    "crates/obc-movement",
    "crates/obc-navigation",
    "crates/obc-tool-api",
    "crates/obc-reflex",
    "crates/obc-foresight",
    "crates/obc-learning",
    "crates/obc-fleet",
]
exclude = [
    # GUI is built separately via `pnpm tauri build` — not part of the CLI workspace CI
    "gui/src-tauri",
    # ESP32-S3 firmware is its own workspace (Espressif Rust toolchain + xtensa
    # target, older esp-idf crate generation). Keeping it out of the host
    # workspace gives it an independent Cargo.lock, so host-only deps (the
    # edition2024 `toml`/`winnow` generation, `filetime`, …) never leak onto the
    # chip build.
    "firmware/obc-esp32-s3",
    # Heltec WiFi LoRa 32 V3 (ESP32-S3 + SX1262) — Phase B LoRa mesh node; its own
    # workspace for the same Espressif-toolchain reasons as obc-esp32-s3.
    "firmware/heltec-lora-linktest",
]
resolver = "2"

[package]
name = "oh-ben-claw"
# Plain `cargo run` should launch the agent, not the emit-* helper binaries.
default-run = "oh-ben-claw"
version = "0.1.0"
edition = "2021"
authors = ["thewriterben"]
license = "MIT"
description = "Advanced multi-device AI assistant with distributed peripheral nodes, MQTT spine, and multi-modal I/O."
repository = "https://github.com/thewriterben/Oh-Ben-Claw"
readme = "README.md"
keywords = ["ai", "agent", "assistant", "iot", "multi-device"]
categories = ["command-line-utilities", "api-bindings", "embedded"]

[dependencies]
# CLI
clap = { version = "4.5", features = ["derive"] }

# Async runtime
tokio = { version = "1.42", default-features = false, features = [
    "rt-multi-thread", "macros", "time", "net", "io-util",
    "sync", "process", "io-std", "fs", "signal"
] }

# HTTP client
reqwest = { version = "0.12", default-features = false, features = [
    "json", "rustls-tls", "blocking", "multipart", "stream"
] }

# Serialization
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }

# Config
directories = "5.0"
obc-paths = { path = "crates/obc-paths" }
obc-memory = { path = "crates/obc-memory" }
obc-planner = { path = "crates/obc-planner" }
obc-safety = { path = "crates/obc-safety" }
obc-telemetry = { path = "crates/obc-telemetry" }
obc-observability = { path = "crates/obc-observability" }
obc-scheduler = { path = "crates/obc-scheduler" }
obc-position = { path = "crates/obc-position" }
obc-cost = { path = "crates/obc-cost" }
obc-tunnel = { path = "crates/obc-tunnel" }
obc-conscience = { path = "crates/obc-conscience" }
obc-a2a = { path = "crates/obc-a2a" }
obc-movement = { path = "crates/obc-movement" }
obc-navigation = { path = "crates/obc-navigation" }
obc-tool-api = { path = "crates/obc-tool-api" }
obc-reflex = { path = "crates/obc-reflex" }
obc-foresight = { path = "crates/obc-foresight" }
obc-learning = { path = "crates/obc-learning" }
obc-fleet = { path = "crates/obc-fleet" }
toml = "1.0"
shellexpand = "3.1"

# Logging
tracing = { version = "0.1", default-features = false }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "ansi", "env-filter"] }

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Async traits
async-trait = "0.1"

# UUID
uuid = { version = "1.11", default-features = false, features = ["v4", "std"] }

# Crypto — symmetric encryption, HMAC, and key derivation
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
rand = "0.8"
hmac = "0.12"
sha2 = "0.10"
# Used by the node-side spine-auth module the host harness compiles
# (tests/spine_auth_vectors.rs) and by obc-safety's copy of it.
hkdf = "0.12"
hex = "0.4"
argon2 = { version = "0.5", features = ["std"] }
# Ed25519 detached signatures for the Track 0 audit (asymmetric, third-party verifiable)
ed25519-dalek = { version = "2", features = ["rand_core"] }

# Concurrency
parking_lot = "0.12"

# Memory / persistence
rusqlite = { version = "0.38", features = ["bundled"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }

# MQTT spine — the core communication backbone for multi-device coordination
# No TLS feature. `use-rustls` pulled rustls-webpki 0.102.8, which carries four
# RUSTSEC advisories in certificate and CRL handling and has no upgrade path -
# rumqttc 0.25.1 still pins the same version. It was compiled in and never
# reached: MQTT-over-TLS has never been wired (see SpineConfig::tls), so this was
# a vulnerable certificate-validation stack shipped for a feature that does not
# exist. Removing the feature removes the advisories rather than suppressing them.
rumqttc = { version = "0.24", default-features = false }

# Hardware discovery
nusb = { version = "0.2", default-features = false, optional = true }

# Serial port for peripheral communication. The LoRa gateway uses the blocking
# `serialport` crate on a reader thread — tokio-serial reads were observed to
# pend forever on Windows (bench, 2026-07-17); tokio-serial remains for the
# other serial drivers (arduino, lora_mesh).
tokio-serial = { version = "5", default-features = false, optional = true }
serialport = { version = "4", default-features = false, optional = true }

# Base64 encoding (screenshots, image data, audio)
base64 = "0.22"

# HTTP server (gateway)
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query"] }
tower = { version = "0.5", default-features = false }
tower-http = { version = "0.6", default-features = false, features = ["limit", "timeout", "cors"] }
http-body-util = "0.1"

# Discord WebSocket
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
tokio-stream = { version = "0.1", default-features = false, features = ["sync"] }

# Cron scheduling
cron = "0.12"

# Interactive CLI prompts
dialoguer = { version = "0.12", features = ["fuzzy-select"] }
console = "0.15"

# Glob patterns
glob = "0.3"


# System info
libc = { version = "0.2", default-features = false }

# Local semantic embeddings moved with the memory substrate; see
# crates/obc-memory. The `semantic` feature below still enables it from here.

# Raspberry Pi GPIO (Linux only)
[target.'cfg(target_os = "linux")'.dependencies]
rppal = { version = "0.14", optional = true }

[features]
default = ["hardware", "mqtt-spine", "world-anchor"]
# World-memory geo anchoring (SQLite). Default-on for the runtime; the
# `planner-wasm` crate depends on obc-planner *without* this feature, so the
# pure geometry stays wasm-compatible and rusqlite never reaches the chip.
# Now forwards to the crate that owns `geo::anchor`, rather than gating a module
# in this crate. Same name, same default, so no command line changed.
world-anchor = ["obc-planner/world-anchor"]
hardware = ["nusb", "tokio-serial", "serialport"]
mqtt-spine = []
peripheral-rpi = ["rppal"]
peripheral-nanopi = []
peripheral-stm32 = []
gui = []
# Dense retrieval leg for episode memory: local ONNX embeddings (fastembed).
# Off by default so ordinary builds/CI stay light; enable at build time with
# `--features semantic` and at runtime with `[self_improvement].semantic`.
semantic = ["obc-memory/semantic"]

[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 8
strip = true
panic = "abort"

[profile.dist]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3.14"
