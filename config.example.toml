# Open Body Control — example configuration
#
# Copy to the platform config directory and edit — on Linux
# `~/.config/oh-ben-claw/config.toml`, on Windows
# `%APPDATA%\thewriterben\oh-ben-claw\config\config.toml`. Or put it in the data
# root (see [paths] below) if you want a self-contained instance, or point at it
# directly with `--config` / `OBC_CONFIG`.
#
# Everything here has a working default; the file exists so you can see what is
# adjustable, not because you need all of it.
#
# YOU MAY NOT NEED THIS FILE AT ALL. With no config, OBC looks at which provider
# key is in your environment and uses that one:
#
#     export ANTHROPIC_API_KEY=sk-ant-...   # or OPENAI_API_KEY, OPENROUTER_API_KEY
#     oh-ben-claw start
#
# With no key anywhere it falls back to a local Ollama, which needs none. Write
# this file when you want to pin a choice rather than have one inferred.

[agent]
# Context management (2026-09-11). The agent assumes the model's window is
# context_tokens; OBC's Ollama adapter sends no num_ctx, so make this match the
# Modelfile of the model you run (8192 is Ollama's global default). Past
# compaction_threshold × context_tokens of history, older messages are folded
# by the model into one persisted "[Conversation summary through #<id>]"
# message that leads the context; the last compaction_keep_tail messages are
# never folded. Nothing is deleted from memory.db.
# context_tokens = 8192
# compaction_threshold = 0.5
# compaction_keep_tail = 8
# compaction = true
#
# Ollama + a thinking model (Qwen3): set think = false under [provider] to
# answer directly. "/no_think" in the prompt is ignored by the template; on
# the bench the model thought for 228 tokens (5.9 s) before a one-line reply.
# Do not set it for models without the thinking capability (Ollama rejects it).
name = "obc"

# The one string that says what this agent is for. With no purpose here, the
# agent infers one from whatever the recent conversation happens to be about —
# which is how an agent ends up describing itself as whatever subsystem it was
# last asked about.
#
# You do NOT need to describe the world here. Current beliefs — what the sensors
# report, with provenance and age, plus anything recently withdrawn and why —
# are supplied to the model separately on every turn. See [perception.context].
system_prompt = """
You are OBC, an agent with a body: microcontroller nodes, sensors and cameras
you can read and command.

Answer directly and concisely. Reach for a tool when the answer depends on the
current state of the machine or the mesh; otherwise just answer. Confirm before
writing files, running shell commands, or changing configuration.
"""

# ── Where this instance keeps its data ───────────────────────────────────────
# Unset means the platform convention: ~/.local/share/oh-ben-claw on Linux,
# %APPDATA%\thewriterben\oh-ben-claw\data on Windows, ~/Library/Application
# Support/com.thewriterben.oh-ben-claw on macOS.
#
# Everything lives under this one root — memory.db, world.db, scheduler.db,
# vault.db, the journal, the audit chain, standing approval grants. Two agents on
# one machine need two roots, or they share all of the above, including the
# permission-to-act grants.
#
# The OBC_DATA_DIR environment variable overrides this, because starting a second
# instance should not require editing a file the first one reads.
#
# [paths]
# data_dir = "/srv/obc/kitchen"

# ── Brain ────────────────────────────────────────────────────────────────────
[provider]
# "anthropic" | "openai" | "openrouter" | "ollama" | "compatible"
name = "anthropic"

# MODEL IDS MOVE. This is the first line to change if the provider returns a
# 404 or "unknown model" — it is a snapshot of what was current when this file
# was written, not a guarantee.
model = "claude-sonnet-5"

# api_key is deliberately NOT set here.
#
# Leave it unset and export ANTHROPIC_API_KEY / OPENAI_API_KEY /
# OPENROUTER_API_KEY instead. An inline key works and warns at startup: this is
# the file people paste into issues, commit to repositories, and hand over when
# asking for help, and a credential in it leaves with the file.
# api_key = "sk-..."

temperature = 0.7

# Ordered fallbacks, tried in turn when the primary fails. Worth having: an
# agent with reflexes keeps reacting when its brain is unreachable, but it
# cannot reason, and a second provider is cheaper than an outage.
# [[provider.fallbacks]]
# name = "openai"
# model = "gpt-4o"

# Running locally instead — no key, no per-token cost, and a smaller model:
# [provider]
# name = "ollama"
# model = "llama3.2"
# base_url = "http://localhost:11434/api/chat"

[provider.retry]
max_attempts = 3
initial_backoff_ms = 500

# ── Perception ───────────────────────────────────────────────────────────────
[perception]
# The temporal world model: bitemporal facts with provenance, a support graph,
# and four ways a belief can stop being held. Off by default; most of what makes
# this an embodied agent rather than a chatbot depends on it.
world_memory = true

# What the agent is shown about its own beliefs, every turn. Costs context —
# roughly 2 KB at these settings — and is the difference between an agent that
# knows what it believes and one that must think to ask.
[perception.context]
enabled = true
max_facts = 24
max_withdrawals = 5
max_chars = 2400
# include = ["mesh.", "trail."]   # restrict to prefixes; empty = everything

# Retention: the only way to withdraw a belief that nothing else can reach.
# An agent's own notes are never superseded (nothing rewrites that entity),
# never orphaned (the agent does not stop existing), and never undercut (an
# assertion rests on nothing recorded). Without a policy they are believed
# forever. Nothing expires unless you say so.
#
# [[perception.expiry]]
# prefix = "incident."
# max_age_ms = 604800000       # 7 days, measured from when it was recorded
# origins = ["asserted"]       # the agent's own conclusions, never a reading

# Perceive any MCP server: call one tool on a cadence and fold its JSON result
# into world memory as `{name}.{path}` facts, changes only. This is how a
# printer, a design engine's ledger or a peer's inventory becomes something the
# world-state block can say and a reflex rule can watch -- the ClawCam poll
# minus everything that is about cameras. Requires world_memory = true.
#
# Unknown keys under [perception] are an error since 2026-09-06: a block named
# `printer_poll`, which never existed, was parsed and discarded for two weeks
# while `doctor` reported 0 errors. The shape that exists is this one:
#
# [[perception.polls]]
# name = "printer"                 # facts: printer.state, printer.temps.nozzle, ...
# tool = "printer_status"
# interval_ms = 5000               # default; clamped to >= 250
# # args = { }                     # tool arguments, default {}
# # source = "mcp:printer"         # default
# # max_facts = 64                 # leaves per tick past this are dropped and counted
# [perception.polls.server]
# transport = "stdio"
# command = "python"
# args = ["-m", "studio_mcp.server", "--base", "http://localhost:8770"]

# ── MCP tool import ──────────────────────────────────────────────────────────
# The other half of `[[perception.polls]]`: a poll folds a server's answers into
# world memory; an import puts a server's *tools* in the model's hands. Any MCP
# server, an explicit allowlist (required — every schema goes into every prompt
# and this deployment already spends ~7k of 8k tokens on twenty-four of them),
# prefixed names so two servers cannot shadow each other, and a `guidance`
# sentence appended to each tool's description.
#
# The guidance line below is not decoration. Measured 2026-09-06 against
# OpenDesignCore with three local models: without it, 3 of 3 substituted a
# different part when the one asked for was not in the registry; with it, 2 of 2
# refused and said why. The engine checks ids and voxel sizes; it cannot check
# intent, so intent is stated where the model reads it.
#
# [[mcp.servers]]
# name = "odc"
# tools = ["list_parts", "run_enclosure", "handoff_to_studio"]
# guidance = "If the registry does not offer the exact part asked for, stop and say it is not offered and why; never substitute a different part."
# # prefix = true                  # registers odc_list_parts, odc_run_enclosure, ...
# [mcp.servers.server]
# transport = "stdio"
# command = "F:/Documents/GitHub/OpenDesignCore/src/OpenDesignCore.Mcp/bin/Release/net9.0/opendesigncore-mcp.exe"
# env = { ODC_ROOT = "F:/Documents/GitHub/OpenDesignCore", ODC_OPENPARTSCORE = "F:/Documents/GitHub/OpenPartsCore" }

# ── Edge-native mode ─────────────────────────────────────────────────────────
# For a small single-board host (NanoPi, Pi) running the brain on the device.
# The deployment planner emits this section for those boards.
#
# Every key here does something, which was not true until 2026-07-28:
# max_history_messages and max_tool_iterations bound the agent at construction,
# and p2p_enabled makes it join the broker-free local mesh and register whatever
# peer tools it finds. `enabled` is the caller's decision — it is what makes them
# build an edge agent at all rather than the ordinary one.
#
# [edge]
# enabled = true
# max_history_messages = 20      # bounds RAM on a device that has little
# max_tool_iterations = 5
# p2p_enabled = true             # join the local mesh; no broker needed

# ── Reflexes ─────────────────────────────────────────────────────────────────
# System 1: fast local rules over world state that act without waking the model.
[reflex]
enabled = true
safing = true
interval_ms = 1000
max_escalations_per_min = 6

# System 2: escalations wake the model, novelty-gated so a standing condition
# does not wake it forever.
[system2]
enabled = true
novelty_window_ms = 600000
max_wakes_per_hour = 6

# ── Safety (Track 0) ─────────────────────────────────────────────────────────
# Deterministic, model-independent limits on physical actuation. These are
# enforced in code before any command reaches hardware — not instructions to
# the model, which can be argued out of.
[safety]
enabled = true
# audit_key = "..."            # HMAC key for the tamper-evident action log
dynamic_trust = true
taint_mode = "warn"

# NOTE the plural. `[[safety.limit]]` parses as an unknown key and silently
# leaves the gate with zero limits — which is why unknown keys under [safety]
# are now a hard error rather than a shrug.
# [[safety.limits]]
# node_id = "obc-esp32-s3-001"
# tool = "gpio_write"
# allowed_pins = [12, 13]
# value_min = 0
# value_max = 1
# min_interval_ms = 500

# ── Tool execution policy ────────────────────────────────────────────────────
# A host-side allowlist over the tool surface, evaluated on every tool call and
# on every hop — so it re-checks the target after a skill delegates, not just the
# name the model first said. Policies are tried in order and the FIRST MATCH
# WINS; if nothing matches the call is allowed.
#
# This is not a sandbox and does not replace Track 0 above. Track 0 lives on the
# microcontroller and holds even if this host is compromised. This layer narrows
# what a *hijacked reasoner* can reach — the path docs/SAFETY.md names, where text
# recovered by `vision_analyze` arrives in the planner as prose — and it is worth
# exactly as much as the host it runs on.
#
# There are no policies by default: an unconfigured agent permits every tool,
# including `shell`, and says so at startup. The block below is the recommended
# starting point (`security::policy::baseline()`), commented out because turning
# it on silently would break anyone whose agent administers its own host.
#
#   action = "deny"   refuse the call; the model is told which policy refused it
#   action = "audit"  allow, and log the call and its arguments at WARN
#   action = "allow"  allow, and stop evaluating later rules (use it to carve an
#                     exception out of a broader deny below it)
#
# arg_contains is a plain substring test against the serialised arguments, not a
# parsed field — "delete" also matches a path containing the word. For a deny
# rule that is the safe direction to be wrong in.

# [[security.policies]]
# name = "no-shell"
# tool_pattern = "shell"
# action = "deny"
# reason = "arbitrary host command execution; the largest non-physical blast radius"

# [[security.policies]]
# name = "no-file-delete"
# tool_pattern = "file"
# arg_contains = "delete"
# action = "deny"
# reason = "irreversible, and the file tool has no path sandbox"

# [[security.policies]]
# name = "audit-network-egress"
# tool_pattern = "http"
# action = "audit"
# reason = "the exfiltration path once a planner is influenced by untrusted text"

# [[security.policies]]
# name = "audit-firmware-push"
# tool_pattern = "ota_update"
# action = "audit"
# reason = "the node keeps enforcing Track 0, but on the firmware you just flashed"

# [[security.policies]]
# name = "audit-skill-install"
# tool_pattern = "skill_forge"
# action = "audit"
# reason = "installs and promotes community code into the running agent"

# ── Gateway ──────────────────────────────────────────────────────────────────
[gateway]
enabled = true
host = "127.0.0.1"
port = 8090

# ── A2A: being reachable by other agents ─────────────────────────────────────
# Serve this agent over Google's Agent-to-Agent v1.0 protocol, so another agent
# can discover it and send it work:
#
#   oh-ben-claw a2a-serve --port 4311
#
# This block used to parse and be read by nothing — `enabled = true` changed
# nothing at all, and it was not in this file either, so it was inert *and*
# undiscoverable. It is read now: `a2a-serve` refuses to start unless enabled,
# and the card it serves at /.well-known/agent-card.json is built from these
# fields.
[a2a]
enabled = false

# What the card advertises. `agent_url` is the address *other agents* call, so
# it must be reachable from where they run — not necessarily the bind address.
# `--advertise` overrides it for the usual reverse-proxy or tunnel case.
agent_name = "oh-ben-claw"
agent_description = "Oh-Ben-Claw AI assistant"
agent_url = "http://localhost:4311/a2a"

# Skills to advertise. Leave empty to advertise the agent's actual tool names,
# which is the honest default: a card promising a skill the agent does not load
# is a lie told at discovery time.
skills = []
