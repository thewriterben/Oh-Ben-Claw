# This crate is its own workspace root, decoupled from the repo's host CLI
# workspace, so it resolves the (older) esp-idf crate generation independently on
# the Espressif Rust toolchain. See the root Cargo.toml `exclude` for why.
[workspace]

[package]
name = "obc-esp32-s3"
version = "0.1.0"
edition = "2021"
authors = ["thewriterben"]
description = "Oh-Ben-Claw firmware for ESP32-S3 — GPIO, camera, microphone, sensors, MQTT, and edge-native LLM agent."

[dependencies]
# esp-idf-svc 0.52.x (esp-idf-hal 0.46.x, esp-idf-sys 0.37.x) is the generation
# that fixed the `c_char` (i8/u8) handling for newer Rust toolchains, so it
# builds on the current Espressif toolchain. Keep svc/hal in sync.
esp-idf-svc = { version = "0.52", features = ["std", "experimental"] }
esp-idf-hal = "0.46"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
log = "0.4"

# NOTE: `embuild` is a host build tool (used only in build.rs); it must NOT be a
# normal dependency, or it — and its host-only deps like `filetime` — get
# cross-compiled to the chip, which fails (espidf's newlib libc lacks
# futimes/lutimes/UTIME_OMIT). Keep it in [build-dependencies] only.
[features]
# Off by default: the default build needs no PSRAM and no esp32-camera IDF
# component. Enable with `--features camera` AFTER adding `idf_component.yml` and
# the PSRAM sdkconfig (see CAMERA.md). This feature disables the I2C sensor bus.
# The stated reason used to be that the camera SCCB shares pins 4/5 with it;
# that stopped being true on 2026-08-21 when the default bus moved to GPIO5/6.
# The gate is kept as a conservative default, not a necessity -- see camera.rs.
#
# "Not applicable to the Waveshare 2.1 board (no camera connector)" was written
# here on faith and confirmed by eye on 2026-08-21: that board's only FPC
# connector is the screen's. The combination is now a compile_error in
# camera.rs, because this map's pins are that board's LCD lines.
#
# A camera build must ALSO name its board (below). There is deliberately no
# default pin map: a default is exactly what let "the Waveshare's pins" sit in
# camera.rs for weeks on a board with no camera connector. `--features camera`
# alone is now a compile_error naming the choice.
camera = []
# Seeed XIAO ESP32S3 Sense camera pin map, from Seeed's own wiki table (retrieved
# 2026-09-16, cited in camera.rs). This is the board the bench node already is,
# so it is the first attributable map in the tree. Needs PSRAM enabled.
board-xiao-sense = []
# LILYGO T-CameraPlus-S3, revision V1.0/V1.1 ONLY. Pins from the vendor's own
# pin_config.h and README, cited in camera.rs; retrieved 2026-09-16. V1.2 moves
# VSYNC/PWDN/RESET and is a different board -- do not use this feature for it.
# Needs `sdkconfig.defaults.camera-lilygo-tcam-v11` (QUAD PSRAM, not the XIAO's
# OCT) and selects its own board profile in board.rs, because the XIAO's default
# output pins are this board's SD_CS, camera RESET, XCLK and D6.
board-lilygo-tcam-s3-v11 = []
# The historical, unattributed pin map -- matches NO known board. Kept for the
# forensic trail in camera.rs rather than deleted, quarantined behind its own
# feature so nothing selects it by accident. Do not use it to bring up hardware.
board-unverified-map = []
# Pin map for the Waveshare ESP32-S3-Touch-LCD-2.1 (round 480x480 RGB LCD).
# That board exposes ONLY GPIO 0/19/20/43/44 (12-pin header) + a hardwired I2C
# connector on SDA=15/SCL=7; the RGB LCD consumes most other GPIOs, so the
# default XIAO pin map would drive LCD lines. This feature: safe outputs 43/44
# (spine UART1 disabled — the XIAO is the mesh-bridged node), DHT22 on GPIO0,
# I2C sensors on 15/7. Command I/O stays on native USB-Serial-JTAG (19/20).
board-waveshare-21 = []

[build-dependencies]
embuild = "0.33"

[[bin]]
name = "obc-esp32-s3"
path = "src/main.rs"

# ── Camera component (only meaningful with `--features camera`) ──────────────────
# esp-idf-sys pulls the esp32-camera managed component and generates Rust bindings
# from `bindings_header` — `esp_camera.h` is NOT in esp-idf-sys's default bindings,
# which is why the `camera_*` symbols were missing. This is a BUILD-LEVEL include
# (not gated by the cargo feature): it pulls the component into every build. Comment
# this block out — and the PSRAM lines in `sdkconfig.defaults` — for lean non-camera
# builds. After changing this block, run `cargo clean` so esp-idf-sys regenerates.
#
# It CANNOT be gated on a cargo feature, and that was checked in esp-idf-sys
# 0.37.2's source rather than assumed: `extra_components` is an exclude in
# `try_from_env()` (cargo_driver/config.rs:72-74), the `cargo metadata` call that
# reads it passes no feature flags (config.rs:107-113), and `CARGO_FEATURE_*` is
# read nowhere in that crate's build/. A camera-feature-OFF build with these
# lines uncommented still downloads and compiles the component.
#
# DISABLED for lean/default builds. Uncomment ALL FOUR lines only on a
# `camera-bringup` branch -- never commit them to main, because a default build
# from such a tree produces a different binary from the one on the live mesh
# node. PSRAM is handled separately and does NOT need an edit here: see
# `sdkconfig.defaults.camera` and CAMERA.md §2. ADR: OBC-Prime docs/DECISIONS.md,
# 2026-09-16.
# ENABLED HERE. This is the `camera-bringup` branch and these four lines are the
# only reason it exists.
#
# 2026-09-17: they were lost once, in the least interesting way available.
# `git merge main` on this branch **fast-forwarded** -- the branch had no commits
# of its own, so merging moved it to main, where these lines are commented out.
# The next build produced a camera-less firmware from camera source and failed
# with `no camera in sys`, which reads like a toolchain problem and is not one.
# A full `cargo clean` and IDF rebuild were spent on it.
#
# If that error appears again: check these four lines before anything else.
[[package.metadata.esp-idf-sys.extra_components]]
remote_component = { name = "espressif/esp32-camera", version = "2.0.7" }
bindings_header = "src/camera_bindings.h"
bindings_module = "camera"   # bindings land in their own esp_idf_sys::camera module
