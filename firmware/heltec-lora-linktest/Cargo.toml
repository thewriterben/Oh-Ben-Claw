# Standalone Heltec WiFi LoRa 32 V3 (ESP32-S3 + SX1262) firmware — its own
# workspace/crate for the same reasons as obc-esp32-s3 (Espressif Xtensa toolchain,
# older esp-idf crate generation, independent Cargo.lock).
[workspace]

[package]
name = "heltec-lora-linktest"
version = "0.1.0"
edition = "2021"
authors = ["thewriterben"]
description = "Phase B step 1: Heltec WiFi LoRa 32 V3 board bring-up + (next) SX1262 LoRa link test."

[dependencies]
esp-idf-svc = { version = "0.52", features = ["std", "experimental"] }
esp-idf-hal = "0.46"
anyhow = "1.0"
log = "0.4"

# Spine frame authentication (SPINE-AUTH.md step 2). Pure Rust so `src/auth.rs`
# compiles for the host harness as well as for xtensa; the ESP32-S3's hardware
# SHA is the eventual destination and an optimisation, not a prerequisite.
hmac = "0.12"
sha2 = "0.10"
hkdf = "0.12"

[features]
# Bench build: SX1262 TX at its minimum (-9 dBm) instead of +22. Two Heltecs
# at arm's length on a desk read -8 to -20 dBm at full power, and above about
# -35 the receiver overdrives: ~55 B keepalives pass while 120 B+ frames
# vanish (BENCH-PINOUT-CARDS.md Card 0; measured again 2026-09-12 with the
# spinal tier's 121 B replies arriving 1 in 5). 31 dB less puts the same desk
# at ~-50. The boot log names the power so a bench build cannot be mistaken
# for a field one.
bench-low-power = []
# Do not flood-relay received frames. For the base station, which is the sink:
# it was re-broadcasting every frame it heard, deaf for the ~300 ms each relay
# takes, and on 2026-09-12 that cost it about half of everything gw-40 sent —
# the frame after any received frame, reliably. A relay is a role
# (heltec-relay); a station with a host plugged in should not play it.
#
# The same role also slows this station's keepalive from 5 s to 30 s
# (KEEPALIVE_MS in main.rs). Measured 2026-09-25: every frame the base lost
# from gw-D8 over 45 minutes was on the air while the base was transmitting
# its own keepalive, and nothing waits on the base's keepalive.
no-relay = []
# Bench only: the console line `{"bench":"nvs_fault"}` poisons the counter
# store so every NVS read and write fails from then on — SPINE-REPLAY.md §6
# step 5 ("NVS failure stops transmission") without corrupting a real
# partition. The fault is at the `CeilingStore` boundary, which is where the
# firmware decides to fail closed; a reset clears it. Never in a field build:
# the boot log names it.
bench-nvs-fault = []
# Bench only: build with a root secret that is deliberately NOT the
# deployment's, so every frame this station sends is refused by every station
# and host that holds the real one — the forged-station half of
# SPINE-REPLAY.md §6 step 7, and the only way to produce a `bad tag` on the air
# on purpose. The `env!("OBC_SPINE_ROOT")` is cfg'd away, so such a board
# carries no deployment secret at all and cannot be confused for a provisioned
# station; it also builds without the secret set, which is the tell. The boot
# log says so at error level. Never in a field build.
bench-wrong-root = []

[build-dependencies]
embuild = "0.33"

[[bin]]
name = "heltec-lora-linktest"
path = "src/main.rs"
